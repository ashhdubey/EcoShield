# ===================================================================
# APPLICATION CONFIGURATION
# ===================================================================
# Defines the name of the application.
spring.application.name=api

# Sets the port the backend server will run on.
server.port=8080


# ===================================================================
# DATABASE CONNECTION (PostgreSQL)
# ===================================================================
# The connection URL for your local PostgreSQL database.
# Ensure your database is named 'ecoshield_db'.
spring.datasource.url=jdbc:postgresql://localhost:5432/ecoshield_db

# Your PostgreSQL username.
spring.datasource.username=postgres

# IMPORTANT: Replace this with your actual PostgreSQL password.
spring.datasource.password=Ashish@123


# ===================================================================
# JPA / HIBERNATE SETTINGS
# ===================================================================
# 'update' automatically updates the database schema to match your Java entities.
spring.jpa.hibernate.ddl-auto=update

# Ensures that data.sql runs after the schema is updated by Hibernate.
spring.jpa.defer-datasource-initialization=true

# Ensures the data.sql script runs every time the application starts.
spring.sql.init.mode=always


# ===================================================================
# SECURITY CONFIGURATION (JWT)
# ===================================================================
# This is a very important secret key for signing JWT tokens.
# It should be a long, random, and complex string.
jwt.secret=RWNvU2hpZWxkX1Byb2plY3RfU2VjcmV0X0tleV9Gb3JfSldUX0F1dGhlbnRpY2F0aW9uX0FuZF9BdXRob3JpemF0aW9uX3YyLjk=

# JWT token expiration time in milliseconds (e.g., 86400000ms = 24 hours).
jwt.expiration=604800000


